<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rehearsal Marks</title>
    <!--
      PROTOTYPE (visual redesign, branch `prototype/visual-direction`):
      the three faces the two directions are built on.

      - Source Serif 4 — Direction A's content face: an engraving-character
        serif for movement names, marks and times.
      - Public Sans — Direction A's chrome face: a neutral grotesque, so the
        two jobs are two clearly separate faces.
      - Archivo — Direction B's one face, carrying the `wdth` axis so the boxed
        marks get a wide display cut and everything else stays at normal width.

      Loaded from Google Fonts because this is a throwaway branch; the fold
      decides how the winner's faces are actually served.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Public+Sans:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
